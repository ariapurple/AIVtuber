<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AILive2D 登入</title>
  <style>
    :root { color-scheme: dark; --bg:#101014; --panel:#1a1a20; --line:#2c2c34; --text:#ececf1; --muted:#9a9aa8; --accent:#d4a27f; --bad:#d98989; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font:15px/1.45 "Segoe UI","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); }
    .card { width:min(400px,92vw); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; }
    h1 { margin:0 0 6px; font-size:20px; }
    p { color:var(--muted); margin:0 0 16px; font-size:13px; }
    label { display:block; color:var(--muted); margin:10px 0 6px; font-size:13px; }
    input { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#101012; color:var(--text); font:inherit; }
    button { margin-top:16px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#1a120c; font-weight:700; cursor:pointer; }
    .err { color:var(--bad); min-height:1.2em; margin-top:10px; font-size:13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AILive2D 登入</h1>
    <p>admin 睇全部控制台；trainer 只見訓練文字 chatroom。</p>
    <label for="username">帳號</label>
    <input id="username" autocomplete="username" value="admin" />
    <label for="password">密碼</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="go">登入</button>
    <div class="err" id="err"></div>
  </div>
  <script>
    document.getElementById("go").onclick = async () => {
      const err = document.getElementById("err");
      err.textContent = "";
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        err.textContent = data.detail || data.error || "登入失敗";
        return;
      }
      location.href = data.redirect || (data.role === "trainer" ? "/train" : "/");
    };
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("go").click();
    });
  </script>
</body>
</html>
